<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Nuevo Libro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-6 md:p-10 flex items-center justify-center min-h-screen">

    <div class="max-w-md w-full bg-white rounded-xl shadow-md border border-gray-200 p-6 md:p-8">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Registrar Nuevo Libro</h1>

        {% if error_message %}
            <p class="bg-red-100 text-red-700 p-3 rounded mb-4 text-sm"><strong>{{ error_message }}</strong></p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Guardar</button>
        </form>

        <div class="text-center">
            <a href="{% url 'libros:inicio' %}" class="text-sm text-blue-600 hover:underline font-medium">Volver a la biblioteca</a>
        </div>
    </div>
</body>
</html>
