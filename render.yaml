services:
  - type: web
    name: biblioteca-uninpahu
    runtime: docker
    plan: free
    dockerfilePath: ./biblioteca/Dockerfile
    dockerContext: .
    envVars:
      - key: DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: biblioteca-db
          property: connectionString

databases:
  - name: biblioteca-db
    databaseName: biblioteca
    user: biblioteca
    plan: free
