services:
  - type: web
    name: biblioteca-uninpahu
    runtime: docker
    plan: free
    dockerfilePath: ./biblioteca/Dockerfile
    dockerContext: ./biblioteca
    envVars:
      - key: DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: biblioteca-db
          property: connectionString
      - key: NODE_SERVICE_URL
        value: https://biblioteca-alertas-api.onrender.com
      - key: NODE_SERVICE_TOKEN
        sync: false