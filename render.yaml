services:
  - type: web
    name: biblioteca-uninpahu
    runtime: docker
    plan: free
    dockerfilePath: ./biblioteca/Dockerfile
    dockerContext: ./biblioteca
    envVars:
      - key: DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: biblioteca-db
          property: connectionString
      - key: NODE_SERVICE_URL
        value: https://biblioteca-alertas-api.onrender.com
      - key: NODE_SERVICE_TOKEN
        sync: false

  - type: web
    name: biblioteca-alertas-api
    runtime: node
    plan: free
    rootDir: microservicios/alertas
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: biblioteca-db
          property: connectionString
      - key: NODE_SERVICE_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: biblioteca-db
    databaseName: biblioteca
    user: biblioteca
    plan: free