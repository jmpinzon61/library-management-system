<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Libro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex min-h-screen flex-col bg-gray-50">
    {% include "libros/includes/header.html" %}

    <main class="flex flex-grow items-center justify-center p-6 md:p-10">
    <div class="w-full max-w-md rounded-xl border border-gray-200 bg-white p-6 text-center shadow-md md:p-8">
        <div class="text-red-500 text-4xl mb-3">⚠️</div>
        <h1 class="text-xl font-bold text-gray-800 mb-6">¿Estás seguro de que deseas eliminar el libro?</h1>

        <form action="{% url 'libros:eliminar_libro' libro.id %}" method="post" class="space-y-3">
            {% csrf_token %}
            <input type="submit" value="Sí, eliminar" class="w-full bg-red-600 hover:bg-red-700 text-white font-medium py-2.5 rounded-lg shadow transition cursor-pointer">
        </form>
        
        <div class="mt-4">
            <a href="{% url 'libros:detalle' libro.id %}" class="text-sm text-gray-600 hover:underline font-medium">Cancelar</a>
        </div>
    </div>
    </main>
    {% include "libros/includes/footer.html" %}

</body>
</html>
